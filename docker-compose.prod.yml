services:
  backend:
    build: ./backend
    container_name: autoservice-backend-prod
    env_file:
      - .env.production
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    ports:
      - "8000:8000"
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    image: nginx:alpine
    container_name: autoservice-frontend-prod
    ports:
      - "80:80"
    volumes:
      - ./frontend/web:/usr/share/nginx/html:ro
    restart: unless-stopped
    depends_on:
      - backend