version: '3.8'

services:
  backend:
    build: ./backend
    container_name: autoservice-backend-prod
    env_file:
      - .env.production
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: autoservice-frontend-prod
    ports:
      - "80:80"
    volumes:
      - ./frontend/web:/usr/share/nginx/html:ro
    restart: unless-stopped
    depends_on:
      - backend