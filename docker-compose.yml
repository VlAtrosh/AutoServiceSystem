version: '3.8'

services:
  backend:
    build: ./backend
    container_name: autoservice-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - SECRET_KEY=your-secret-key-here
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: autoservice-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend/web:/usr/share/nginx/html
    depends_on:
      - backend
    restart: unless-stopped