<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АвтоСервис — Панель управления</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <div class="app-layout">
        <!-- Боковое меню -->
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon">⚙️</div>
                <h1>АвтоСервис</h1>
            </div>

            <nav class="nav-menu">
                <a href="#" class="nav-item" data-page="crm">
                    <span class="nav-text">CRM</span>
                </a>

                <div class="nav-item has-submenu">
                    <span class="nav-text">Сервис</span>
                    <span class="submenu-arrow">▼</span>
                    <div class="submenu">
                        <a href="#" class="submenu-item" data-page="orders">Заказ-наряды</a>
                        <a href="#" class="submenu-item" data-page="appointment">Запись на ремонт</a>
                    </div>
                </div>

                <a href="#" class="nav-item" data-page="cars">
                    <span class="nav-text">Автомобили</span>
                </a>

                <a href="#" class="nav-item" data-page="reports">
                    <span class="nav-text">Отчёты</span>
                </a>

                <div class="nav-item has-submenu">
                    <span class="nav-text">Справочники</span>
                    <span class="submenu-arrow">▼</span>
                    <div class="submenu">
                        <a href="#" class="submenu-item" data-page="clients">Клиенты</a>
                        <a href="#" class="submenu-item" data-page="workers">Исполнители</a>
                        <a href="#" class="submenu-item" data-page="works-ref">Работы</a>
                    </div>
                </div>
            </nav>

            <div class="user-section">
                <div class="user-card" id="user-profile-btn">
                    <div class="user-avatar" id="user-avatar">👤</div>
                    <div class="user-info">
                        <div id="user-name" class="user-name">Пользователь</div>
                        <div id="user-role" class="user-role"></div>
                        <div class="user-id">ID: <span id="user-id"></span></div>
                    </div>
                </div>
                <div class="user-dropdown" id="user-dropdown">
                    <div class="dropdown-item" id="dropdown-profile">Профиль</div>
                    <div class="dropdown-item" id="dropdown-logout">Выход</div>
                </div>
            </div>
        </aside>

        <!-- Основная область -->
        <main class="main-content">
            <header class="top-bar">
                <h2 id="page-title">Заказ-наряды</h2>
                <div class="search-container">
                    <input type="text" id="global-search" placeholder="Поиск по заказу, авто или клиенту...">
                </div>
                <button id="create-order-btn" class="btn btn-primary">+ Новый заказ</button>
            </header>
            <div id="content-area" class="content-area"></div>
        </main>
    </div>

    <!-- Модальное окно авторизации -->
    <div id="login-modal" class="login-modal">
        <div class="login-modal-content">
            <h3>Вход в систему</h3>
            <p class="login-hint">test@mail.ru / 123</p>
            <input type="text" id="login-email" placeholder="Логин или email" value="client1">
            <input type="password" id="login-password" placeholder="Пароль" value="123">
            <button id="do-login" onclick="manualLogin()">Войти</button>
            <div id="login-error"></div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
