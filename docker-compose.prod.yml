services:
  db:
    image: postgres:16
    container_name: autoservice-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autoservice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: autoservice-backend-prod
    env_file:
      - .env.production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./frontend/web:/app/frontend/web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    image: nginx:alpine
    container_name: autoservice-frontend-prod
    ports:
      - "80:80"
    volumes:
      - ./frontend/web:/usr/share/nginx/html
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: